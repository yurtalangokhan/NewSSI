# Docker Compose - Local Images
# Tüm Supabase bileşenlerini local tag'li image'lardan çalıştırır
# 
# Önce image'ları hazırlayın: cd builds && .\pull-and-tag.ps1
# Sonra çalıştırın: docker compose -f docker-compose.local-images.yml up -d

name: langgraph-with-ui

services:

  studio:
    container_name: supabase-studio
    image: supabase-studio:local
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://studio:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(r.status)})"
        ]
      timeout: 10s
      interval: 5s
      retries: 3
    depends_on:
      analytics:
        condition: service_healthy
    environment:
      HOSTNAME: "::"
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
      DEFAULT_ORGANIZATION_NAME: ${STUDIO_DEFAULT_ORGANIZATION}
      DEFAULT_PROJECT_NAME: ${STUDIO_DEFAULT_PROJECT}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      LOGFLARE_API_KEY: ${LOGFLARE_PUBLIC_ACCESS_TOKEN}
      LOGFLARE_PUBLIC_ACCESS_TOKEN: ${LOGFLARE_PUBLIC_ACCESS_TOKEN}
      LOGFLARE_PRIVATE_ACCESS_TOKEN: ${LOGFLARE_PRIVATE_ACCESS_TOKEN}
      LOGFLARE_URL: http://analytics:4000
      NEXT_PUBLIC_ENABLE_LOGS: true
      NEXT_ANALYTICS_BACKEND_PROVIDER: postgres

  kong:
    container_name: supabase-kong
    image: supabase-kong:local
    restart: unless-stopped
    ports:
      - ${KONG_HTTP_PORT}:8000/tcp
      - ${KONG_HTTPS_PORT}:8443/tcp
    volumes:
      - ./supabase/volumes/api/kong.yml:/home/kong/temp.yml:ro,z
    depends_on:
      analytics:
        condition: service_healthy
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /tmp/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth,request-termination,ip-restriction
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    entrypoint: bash -c 'eval "echo \"$$(cat ~/temp.yml)\"" > /tmp/kong.yml && /entrypoint.sh kong docker-start'

  auth:
    container_name: supabase-auth
    image: supabase-auth:local
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:9999/health"
        ]
      timeout: 5s
      interval: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      analytics:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP}
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: ${ENABLE_ANONYMOUS_USERS}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      GOTRUE_MAILER_URLPATHS_INVITE: ${MAILER_URLPATHS_INVITE}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: ${MAILER_URLPATHS_CONFIRMATION}
      GOTRUE_MAILER_URLPATHS_RECOVERY: ${MAILER_URLPATHS_RECOVERY}
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: ${MAILER_URLPATHS_EMAIL_CHANGE}
      GOTRUE_EXTERNAL_PHONE_ENABLED: ${ENABLE_PHONE_SIGNUP}
      GOTRUE_SMS_AUTOCONFIRM: ${ENABLE_PHONE_AUTOCONFIRM}

  rest:
    container_name: supabase-rest
    image: supabase-rest:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      analytics:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY}
    command: ["postgrest"]

  realtime:
    container_name: realtime-dev.supabase-realtime
    image: supabase-realtime:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      analytics:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sSfL --head -o /dev/null -H \"Authorization: Bearer ${ANON_KEY}\" http://localhost:4000/api/tenants/realtime-dev/health"
        ]
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      PORT: 4000
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"

  storage:
    container_name: supabase-storage
    image: supabase-storage:local
    restart: unless-stopped
    volumes:
      - ./supabase/volumes/storage:/var/lib/storage:z
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://storage:5000/status"
        ]
      timeout: 5s
      interval: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
      imgproxy:
        condition: service_started
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: http://imgproxy:5001

  imgproxy:
    container_name: supabase-imgproxy
    image: supabase-imgproxy:local
    restart: unless-stopped
    volumes:
      - ./supabase/volumes/storage:/var/lib/storage:z
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      IMGPROXY_BIND: ":5001"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_ENABLE_WEBP_DETECTION: ${IMGPROXY_ENABLE_WEBP_DETECTION}

  meta:
    container_name: supabase-meta
    image: supabase-meta:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      analytics:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: ${POSTGRES_HOST}
      PG_META_DB_PORT: ${POSTGRES_PORT}
      PG_META_DB_NAME: ${POSTGRES_DB}
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY}

  functions:
    container_name: supabase-edge-functions
    image: supabase-functions:local
    restart: unless-stopped
    volumes:
      - ./supabase/volumes/functions:/home/deno/functions:Z
    depends_on:
      analytics:
        condition: service_healthy
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SUPABASE_URL: http://kong:8000
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      VERIFY_JWT: "${FUNCTIONS_VERIFY_JWT}"
    command: ["start", "--main-service", "/home/deno/functions/main"]

  analytics:
    container_name: supabase-analytics
    image: supabase-analytics:local
    restart: unless-stopped
    ports:
      - 4000:4000
    healthcheck:
      test: ["CMD", "curl", "http://localhost:4000/health"]
      timeout: 5s
      interval: 5s
      retries: 10
    depends_on:
      db:
        condition: service_healthy
    environment:
      LOGFLARE_NODE_HOST: 127.0.0.1
      DB_USERNAME: supabase_admin
      DB_DATABASE: _supabase
      DB_HOSTNAME: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SCHEMA: _analytics
      LOGFLARE_PUBLIC_ACCESS_TOKEN: ${LOGFLARE_PUBLIC_ACCESS_TOKEN}
      LOGFLARE_PRIVATE_ACCESS_TOKEN: ${LOGFLARE_PRIVATE_ACCESS_TOKEN}
      LOGFLARE_SINGLE_TENANT: true
      LOGFLARE_SUPABASE_MODE: true
      POSTGRES_BACKEND_URL: postgresql://supabase_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/_supabase
      POSTGRES_BACKEND_SCHEMA: _analytics
      LOGFLARE_FEATURE_FLAG_OVERRIDE: multibackend=true

  db:
    container_name: supabase-db
    # Database uses Fedora-built local image
    image: supabase-db:local
    restart: unless-stopped
    ports:
      - 5434:5432
    volumes:
      - ./supabase/volumes/db/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:Z
      - ./supabase/volumes/db/webhooks.sql:/docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql:Z
      - ./supabase/volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:Z
      - ./supabase/volumes/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:Z
      - ./supabase/volumes/db/data:/var/lib/postgresql/data:Z
      - ./supabase/volumes/db/_supabase.sql:/docker-entrypoint-initdb.d/migrations/97-_supabase.sql:Z
      - ./supabase/volumes/db/logs.sql:/docker-entrypoint-initdb.d/migrations/99-logs.sql:Z
      - ./supabase/volumes/db/pooler.sql:/docker-entrypoint-initdb.d/migrations/99-pooler.sql:Z
      - ./supabase/volumes/db/airbyte-init.sh:/docker-entrypoint-initdb.d/init-scripts/97-airbyte.sh:Z
      - db-config:/etc/postgresql-custom
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      vector:
        condition: service_healthy
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: ${POSTGRES_PORT}
      POSTGRES_PORT: ${POSTGRES_PORT}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY}
      AIRBYTE_DB_PASSWORD: ${AIRBYTE_DB_PASSWORD:-airbyte_password}
    command:
      [
        "postgres",
        "-c",
        "config_file=/etc/postgresql/postgresql.conf",
        "-c",
        "log_min_messages=fatal",
        "-c",
        "max_connections=200"
      ]

  vector:
    container_name: supabase-vector
    image: supabase-vector:local
    restart: unless-stopped
    volumes:
      - ./supabase/volumes/logs/vector.yml:/etc/vector/vector.yml:ro,z
      - ${DOCKER_SOCKET_LOCATION}:/var/run/docker.sock:ro,z
    ports:
      - "9001:9001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/9001'"
        ]
      timeout: 5s
      interval: 5s
      retries: 10
    environment:
      LOGFLARE_PUBLIC_ACCESS_TOKEN: ${LOGFLARE_PUBLIC_ACCESS_TOKEN}
    command: ["--config", "/etc/vector/vector.yml"]

  # redis:
  #   container_name: supabase-redis
  #   image: redis:7-alpine
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 5

  # ==========================================================================
  # Airbyte OSS Platform Services
  # ==========================================================================

  airbyte-bootloader:
    container_name: airbyte-bootloader
    image: airbyte/bootloader:${AIRBYTE_VERSION:-0.50.33}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      AIRBYTE_VERSION: ${AIRBYTE_VERSION:-0.50.33}
      DATABASE_URL: jdbc:postgresql://db:${POSTGRES_PORT}/airbyte
      DATABASE_USER: airbyte
      DATABASE_PASSWORD: ${AIRBYTE_DB_PASSWORD:-airbyte_password}
      RUN_DATABASE_MIGRATION_ON_STARTUP: "true"
      LOG_LEVEL: INFO

  airbyte-temporal:
    container_name: airbyte-temporal
    image: airbyte/temporal:${AIRBYTE_VERSION:-0.50.33}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      airbyte-bootloader:
        condition: service_completed_successfully
    volumes:
      - ./supabase/volumes/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    environment:
      DB: postgresql
      DB_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: airbyte
      POSTGRES_PWD: ${AIRBYTE_DB_PASSWORD:-airbyte_password}
      POSTGRES_SEEDS: db
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig/development.yaml
      LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD-SHELL", "nc -z $(hostname -i) 7233 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  airbyte-server:
    container_name: airbyte-server
    image: airbyte/server:${AIRBYTE_VERSION:-0.50.33}
    restart: unless-stopped
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
      airbyte-bootloader:
        condition: service_completed_successfully
      airbyte-temporal:
        condition: service_healthy
    volumes:
      - airbyte-workspace:/tmp/workspace
      - airbyte-data:/data/config
    environment:
      AIRBYTE_VERSION: ${AIRBYTE_VERSION:-0.50.33}
      AIRBYTE_ROLE: ${AIRBYTE_ROLE:-}
      DATABASE_URL: jdbc:postgresql://db:${POSTGRES_PORT}/airbyte
      DATABASE_USER: airbyte
      DATABASE_PASSWORD: ${AIRBYTE_DB_PASSWORD:-airbyte_password}
      TRACKING_STRATEGY: logging
      TEMPORAL_HOST: airbyte-temporal:7233
      INTERNAL_API_HOST: airbyte-server:8001
      WEBAPP_URL: http://airbyte-webapp:8000
      WORKER_ENVIRONMENT: docker
      WORKSPACE_ROOT: /tmp/workspace
      CONFIG_ROOT: /data/config
      LOG_LEVEL: INFO
      DEPLOYMENT_MODE: OSS
      SECRET_PERSISTENCE: NONE
      CONFIGS_DATABASE_MINIMUM_FLYWAY_MIGRATION_VERSION: 0.35.15.001
      JOBS_DATABASE_MINIMUM_FLYWAY_MIGRATION_VERSION: 0.29.15.001
      MICRONAUT_ENVIRONMENTS: control-plane
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/api/v1/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  airbyte-worker:
    container_name: airbyte-worker
    image: airbyte/worker:${AIRBYTE_VERSION:-0.50.33}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      airbyte-server:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-bin/docker:/usr/bin/docker:ro
      - airbyte-workspace:/tmp/workspace
    environment:
      AIRBYTE_VERSION: ${AIRBYTE_VERSION:-0.50.33}
      DATABASE_URL: jdbc:postgresql://db:${POSTGRES_PORT}/airbyte
      DATABASE_USER: airbyte
      DATABASE_PASSWORD: ${AIRBYTE_DB_PASSWORD:-airbyte_password}
      INTERNAL_API_HOST: airbyte-server:8001
      TEMPORAL_HOST: airbyte-temporal:7233
      WORKSPACE_ROOT: /tmp/workspace
      WORKSPACE_DOCKER_MOUNT: langgraph-with-ui_airbyte-workspace
      LOCAL_ROOT: /tmp/airbyte_local
      LOCAL_DOCKER_MOUNT: /tmp/airbyte_local
      DOCKER_NETWORK: langgraph-with-ui_default
      LOG_LEVEL: INFO
      WORKER_ENVIRONMENT: docker
      DEPLOYMENT_MODE: OSS
      SECRET_PERSISTENCE: NONE
      MICRONAUT_ENVIRONMENTS: control-plane
      CONFIG_ROOT: /data/config
      MAX_SYNC_WORKERS: 5
      MAX_CHECK_WORKERS: 5
      MAX_DISCOVER_WORKERS: 5
      MAX_SPEC_WORKERS: 5
      MAX_NOTIFY_WORKERS: 5
      SHOULD_RUN_NOTIFY_WORKFLOWS: "false"
      SYNC_JOB_MAX_ATTEMPTS: 3
      SYNC_JOB_MAX_TIMEOUT_DAYS: 3

  airbyte-webapp:
    container_name: airbyte-webapp
    image: airbyte/webapp:${AIRBYTE_VERSION:-0.50.33}
    restart: unless-stopped
    ports:
      - "8010:80"
    depends_on:
      airbyte-server:
        condition: service_healthy
    environment:
      INTERNAL_API_HOST: airbyte-server:8001
      CONNECTOR_BUILDER_API_HOST: airbyte-server:8001
      AIRBYTE_VERSION: ${AIRBYTE_VERSION:-0.50.33}
      TRACKING_STRATEGY: logging
      KEYCLOAK_INTERNAL_HOST: localhost

  # ==========================================================================
  # Agent Service (thin Airbyte API proxy — no PyAirbyte, no Docker-in-Docker)
  # ==========================================================================

  agent-service:
    container_name: agent-service
    build:
      context: ./agent-service-toolkit
      dockerfile: docker/Dockerfile.service
    restart: unless-stopped
    ports:
      - "8123:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      airbyte-server:
        condition: service_healthy
    environment:
      # Database Configuration
      DATABASE_TYPE: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Ollama Configuration
      OLLAMA_MODEL: llama3.1:8b
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      DEFAULT_MODEL: ollama
      # Optional: LangSmith Tracing
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGCHAIN_PROJECT: agent-service
      MODE: dev
      # Airbyte OSS API Configuration
      AIRBYTE_API_URL: http://airbyte-server:8001/api/v1
      AIRBYTE_SYNC_POLL_INTERVAL_SECONDS: ${AIRBYTE_SYNC_POLL_INTERVAL_SECONDS:-30}
      # Custom destination-embedding config
      AIRBYTE_DESTINATION_AGENT_URL: http://agent-service:8080
      AIRBYTE_EMBED_BATCH_SIZE: ${AIRBYTE_EMBED_BATCH_SIZE:-200}
      # LangConnect Configuration
      RAG_SERVICE_API_URL: http://langconnect-api:8080
      # Neo4j Configuration
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j123}
      # MCP Server Configuration
      MCP_SERVER_URL: http://mcp-server:8003/mcp
      # User Service
      USER_SERVICE_URL: http://user-service:8090

  user-service:
    container_name: user-service
    image: user-service:local
    build:
      context: ./user-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8090:8090"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVICE_NAME: user-service
      SERVICE_HOST: 0.0.0.0
      SERVICE_PORT: 8090
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      KEYCLOAK_ENABLED: "true"
      KEYCLOAK_ISSUER_URL: ${KEYCLOAK_ISSUER_URL}
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-agenticai}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin123}
      KEYCLOAK_ADMIN_EMAIL: ${KEYCLOAK_ADMIN_EMAIL}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-agenticai-web}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-agent-service}
      AUTH_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-UKtf1bGCDl8smcVDRM9YekfivWNlsjSB-Mh0d993z40=}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-token}
      CORS_ALLOWED_ORIGINS: "*"
      LOG_LEVEL: INFO

  langconnect-api:
    container_name: langconnect-api
    restart: unless-stopped
    ports:
      - "8083:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      SUPABASE_URL: http://kong:8000
      SUPABASE_KEY: ${SERVICE_ROLE_KEY}
      ALLOW_ORIGINS: '["*"]'
      EMBEDDING_PROVIDER: ollama
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_EMBED_MODEL: nomic-embed-text
      # Neo4j Configuration
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j123}

  mcp-server:
    container_name: mcp-server
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    image: mcp-server:local
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8003"
    volumes:
      - ./workspace:/workspace

  supavisor:
    container_name: supabase-pooler
    image: supabase-pooler:local
    restart: unless-stopped
    ports:
      - ${POSTGRES_PORT}:5432
      - ${POOLER_PROXY_PORT_TRANSACTION}:6543
    volumes:
      - ./supabase/volumes/pooler/pooler.exs:/etc/pooler/pooler.exs:ro,z
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-sSfL",
          "--head",
          "-o",
          "/dev/null",
          "http://127.0.0.1:4000/api/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
      analytics:
        condition: service_healthy
    environment:
      PORT: 4000
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: ecto://supabase_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/_supabase
      CLUSTER_POSTGRES: true
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      VAULT_ENC_KEY: ${VAULT_ENC_KEY}
      API_JWT_SECRET: ${JWT_SECRET}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      REGION: local
      ERL_AFLAGS: -proto_dist inet_tcp
      POOLER_TENANT_ID: ${POOLER_TENANT_ID}
      POOLER_DEFAULT_POOL_SIZE: ${POOLER_DEFAULT_POOL_SIZE}
      POOLER_MAX_CLIENT_CONN: ${POOLER_MAX_CLIENT_CONN}
      POOLER_POOL_MODE: transaction
      DB_POOL_SIZE: ${POOLER_DB_POOL_SIZE}
    command:
      [
        "/bin/sh",
        "-c",
        "/app/bin/migrate && /app/bin/supavisor eval \"$$(cat /etc/pooler/pooler.exs)\" && /app/bin/server"
      ]

  open-agent-platform:
    container_name: open-agent-platform
    image: open-agent-platform:local
    build:
      context: ./open-agent-platform
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_PUBLIC_URL:-http://10.101.90.13:8000}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
        NEXT_PUBLIC_LANGGRAPH_API_URL: ${LANGGRAPH_API_URL:-http://localhost:8123}
        NEXT_PUBLIC_DEPLOYMENTS: '[{"id":"local-chatbot","deploymentUrl":"http://localhost:8123","tenantId":"local","name":"Local Chatbot","isDefault":true,"defaultGraphId":"chatbot"}]'
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Internal URL for server-side requests (Docker network)
      SUPABASE_INTERNAL_URL: http://kong:8000
      # Public URLs for client-side (browser)
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_PUBLIC_URL:-http://10.101.90.13:8000}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
      NEXT_PUBLIC_LANGGRAPH_API_URL: ${LANGGRAPH_API_URL:-http://localhost:8123}
      # Deployment configuration - use chatbot graph from agent-service
      NEXT_PUBLIC_DEPLOYMENTS: '[{"id":"local-chatbot","deploymentUrl":"http://localhost:8123","tenantId":"local","name":"Local Chatbot","isDefault":true,"defaultGraphId":"chatbot"}]'
    depends_on:
      - kong
      - agent-service

  mongo:
    image: mongo:7
    container_name: mongo
    hostname: mongo
    ports:
      - "27017:27017"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin123
    command: >
      bash -c "
        openssl rand -base64 756 > /tmp/mongodb-keyfile &&
        chmod 400 /tmp/mongodb-keyfile &&
        chown 999:999 /tmp/mongodb-keyfile &&
        exec /usr/local/bin/docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /tmp/mongodb-keyfile
      "
    healthcheck:
      test: >
        mongosh --quiet -u admin -p admin123 --authenticationDatabase admin --eval "
          try {
            rs.status().ok && 1
          } catch(e) {
            rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]});
            sleep(2000);
            rs.status().ok && 1
          }
        "
      interval: 10s
      timeout: 10s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: neo4j
    hostname: neo4j
    restart: unless-stopped
    ports:
      - "8484:7474"   # HTTP (Browser UI)
      - "8697:7687"   # Bolt protocol
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-plugins:/plugins
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-neo4j123}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
      NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*,gds.*
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  mysql:
    image: mysql:8.0
    container_name: mysql
    hostname: mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mysql_root_123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rag_testdb}
      MYSQL_USER: ${MYSQL_USER:-raguser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ragpass123}
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-mysql_root_123}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Custom Airbyte destination — streams records via HTTP to agent-service
  # for in-flight embedding.  No file I/O.
  destination-embedding:
    container_name: destination-embedding
    build:
      context: ./airbyte-destination-embedding
      dockerfile: Dockerfile
    image: airbyte/destination-embedding:latest
    # This container is started by Airbyte worker on-demand during syncs.
    # We build it here so the image is available locally; the container
    # itself is NOT long-running.
    profiles:
      - build-only

  # ============================================
  # Vanilla PostgreSQL (Original Image)
  # ============================================
  postgres-vanilla:
    container_name: postgres-vanilla
    image: postgres:15
    restart: unless-stopped
    ports:
      - 5435:5432
    volumes:
      - postgres-vanilla-data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db-config:
  airbyte-workspace:
  airbyte-data:
  neo4j-data:
  neo4j-logs:
  neo4j-plugins:
  mysql-data:
  postgres-vanilla-data:
