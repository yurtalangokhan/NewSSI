# Docker Compose - Local Source Build
# =====================================
# Bu dosya mevcut docker-compose.yml'ın üzerine yazarak
# tüm Supabase bileşenlerini kaynak koddan build eder.
#
# Kullanım:
#   1. Repo'ları clone edin: cd builds && .\clone-repos.ps1
#   2. Build ve çalıştır: docker compose -f docker-compose.yml -f docker-compose.local.yml up --build -d
#
# Sadece belirli servisleri build etmek için:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml build studio auth
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d

name: supabase

services:

  # ============================================
  # STUDIO - Supabase Dashboard (Next.js)
  # Build süresi: ~5-10 dakika
  # ============================================
  studio:
    build:
      context: ./builds/studio
      dockerfile: apps/studio/Dockerfile
      args:
        NEXT_PUBLIC_STUDIO_VERSION: "local-build"
    image: supabase-studio:local

  # ============================================
  # KONG - API Gateway (Bazel Build)
  # Build süresi: ~30-60 dakika (Bazel + OpenResty + LuaRocks)
  # NOT: İlk build uzun sürebilir, sonraki buildler cache sayesinde hızlı olur
  # ============================================
  kong:
    build:
      context: ./builds/kong
      dockerfile: Dockerfile.source-build
    image: supabase-kong:local

  # ============================================
  # AUTH (GoTrue) - Authentication Service (Go)
  # Build süresi: ~2-3 dakika
  # ============================================
  auth:
    build:
      context: ./builds/gotrue
      dockerfile: Dockerfile
    image: supabase-auth:local

  # ============================================
  # REST (PostgREST) - RESTful API (Haskell/Nix)
  # Build süresi: ~20-40 dakika (Nix + Haskell static build)
  # ============================================
  rest:
    build:
      context: ./builds/postgrest
      dockerfile: Dockerfile
    image: supabase-rest:local

  # ============================================
  # REALTIME - WebSocket Service (Elixir)
  # Build süresi: ~5-10 dakika
  # ============================================
  realtime:
    build:
      context: ./builds/realtime
      dockerfile: Dockerfile
    image: supabase-realtime:local

  # ============================================
  # STORAGE - File Storage API (Node.js)
  # Build süresi: ~2-3 dakika
  # ============================================
  storage:
    build:
      context: ./builds/storage-api
      dockerfile: Dockerfile
    image: supabase-storage:local

  # ============================================
  # IMGPROXY - Image Processing (Go)
  # Build süresi: ~3-5 dakika
  # ============================================
  imgproxy:
    build:
      context: ./builds/imgproxy
      dockerfile: docker/Dockerfile
    image: supabase-imgproxy:local

  # ============================================
  # META - Database Metadata API (Node.js)
  # Build süresi: ~2-3 dakika
  # ============================================
  meta:
    build:
      context: ./builds/postgres-meta
      dockerfile: Dockerfile
    image: supabase-meta:local

  # ============================================
  # FUNCTIONS - Edge Runtime (Deno/Rust)
  # Build süresi: ~10-15 dakika
  # ============================================
  functions:
    build:
      context: ./builds/edge-runtime
      dockerfile: Dockerfile
      args:
        - ONNXRUNTIME_VERSION=1.20.1
        - TARGETPLATFORM=linux/amd64
        - PROFILE=release
    image: supabase-functions:local

  # ============================================
  # ANALYTICS (Logflare) - Log Analytics (Elixir)
  # Build süresi: ~5-10 dakika
  # ============================================
  analytics:
    build:
      context: ./builds/logflare
      dockerfile: Dockerfile
    image: supabase-analytics:local

  # ============================================
  # DB - PostgreSQL Database
  # Nix single-user mode ile build edilir
  # ============================================
  db:
    build:
      context: ./builds/postgres
      dockerfile: Dockerfile-15
    image: supabase-db:local

  # ============================================
  # VECTOR - Log Collector (Rust)
  # Build süresi: ~15-30 dakika (Rust cargo build)
  # ============================================
  vector:
    build:
      context: ./builds/vector
      dockerfile: regression/Dockerfile
    image: supabase-vector:local

  # ============================================
  # SUPAVISOR - Connection Pooler (Elixir)
  # Build süresi: ~5-10 dakika
  # ============================================
  supavisor:
    build:
      context: ./builds/supavisor
      dockerfile: Dockerfile
    image: supabase-pooler:local
