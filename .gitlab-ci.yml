stages:
  - validate

merge-request-validation:
  stage: validate
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - bash scripts/validate-merge.sh "$CI_MERGE_REQUEST_DIFF_BASE_SHA" "$CI_COMMIT_SHA"
  artifacts:
    when: on_failure
    paths:
      - .tmp/validation/
    expire_in: 1 week
