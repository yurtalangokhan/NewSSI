[project]
name = "rag-service"
version = "0.0.1"
description = "RAG Service: a retrieval-augmented generation service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "config-manager",
    "fastapi>=0.115.6",
    "langchain>=0.3.20",
    "langchain-openai>=0.3.7",
    "langchain-ollama>=0.3.2",
    "langchain-community>=0.0.20",
    "langchain-core>=0.2.37",
    "langchain-text-splitters>=0.0.1",
    "langchain-postgres>=0.0.2",
    "langchain-milvus>=0.1.0",
    "langgraph-sdk>=0.1.48",
    "python-dotenv>=1.0.1",
    "uvicorn>=0.34.0",
    "aiohttp>=3.11.13",
    "python-multipart>=0.0.20",
    "httpx>=0.28.1",
    "cachetools>=5.3.0",
    "beautifulsoup4>=4.12.3",
    "pdfminer.six>=20231228",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.6",
    "pillow>=11.2.1",
    "pdfminer.six>=20250416",
    "lxml>=5.4.0",
    "openpyxl>=3.1.0",
    "python-pptx>=0.6.23",
    "python-docx>=1.1.0",
    "error-contract",
    "metrics",
    "supabase>=2.15.1",
    "neo4j>=5.0",
    "langchain-experimental>=0.3.0",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "PyJWT>=2.10.1",
    "idempotency",
    "localization",
    "security",
    "observability",
]

[tool.uv.sources]
config-manager = { path = "../../packages/config-manager" }
idempotency = { path = "../../packages/idempotency" }
localization = { path = "../../packages/localization" }
security = { path = "../../packages/security" }
observability = { path = "../../packages/observability" }
error-contract = { path = "../../packages/error-contract" }
metrics = { path = "../../packages/metrics" }


[project.packages]
find = { where = ["src"] }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "ruff>=0.8.4",
    "langgraph-api>=0.0.28",
    "langgraph-cli>=0.1.75",
    "pytest-socket>=0.7.0",
    "pytest-timeout>=2.4.0",
    "pytest-asyncio>=0.26.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "../../packages/localization/src", "../../packages/idempotency/src", "../../packages/metrics/src", "../../packages/error-contract/src", "../../packages/security/src", "../../packages/observability/src"]
minversion = "8.0"
# -ra: Report all extra test outcomes (passed, skipped, failed, etc.)
# -q: Enable quiet mode for less cluttered output
# -v: Enable verbose output to display detailed test names and statuses
# --durations=5: Show the 10 slowest tests after the run (useful for performance tuning)
addopts = "-ra -q -v --durations=5"
testpaths = [
    "tests",
]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
allow_redefinition = true
disable_error_code = [
  "attr-defined",
  "arg-type",
  "assignment",
  "call-arg",
  "call-overload",
  "dict-item",
  "index",
  "misc",
  "name-defined",
  "no-any-return",
  "no-redef",
  "no-untyped-def",
  "operator",
  "override",
  "return-value",
  "truthy-function",
  "type-arg",
  "untyped-decorator",
  "union-attr",
  "valid-type",
  "var-annotated",
]
