[project]
name = "user-service"
version = "0.1.0"
description = "User Management Microservice — Auth, Users, Roles, Permissions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Agenticai Team" },
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "httpx>=0.28.0",
    "PyJWT>=2.10.0",
    "cryptography>=44.0.0",
    "error-contract",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.20",
    "python-jose[cryptography]>=3.3.0",
    "ldap3>=2.9.1",
    "idempotency",
    "i18n-py",
]

[tool.uv.sources]
idempotency = { path = "../../packages/idempotency-py" }
i18n-py = { path = "../../packages/i18n-py" }
error-contract = { path = "../../packages/error-contract-py" }


[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "N802", "N806", "F821", "UP042"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "I001"]

[tool.pytest.ini_options]
pythonpath = ["src", "../../packages/i18n-py/src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.15.13",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
allow_redefinition = true
exclude = "src/core/database/migrations/"
disable_error_code = [
    "attr-defined",
    "arg-type",
    "assignment",
    "dict-item",
    "index",
    "misc",
    "name-defined",
    "no-redef",
    "operator",
    "return",
    "return-value",
    "union-attr",
]
