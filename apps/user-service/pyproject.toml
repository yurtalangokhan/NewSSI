[project]
name = "user-service"
version = "0.1.0"
description = "User Management Microservice — Auth, Users, Roles, Permissions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Agenticai Team" },
]
dependencies = [
    "config-manager",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "httpx>=0.28.0",
    "redis>=5.0.0",
    "cachetools>=5.3.0",
    "PyJWT>=2.10.0",
    "cryptography>=44.0.0",
    "error-contract",
    "security",
    "observability",
    "metrics",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.20",
    "python-jose[cryptography]>=3.3.0",
    "idempotency",
    "localization",
]

[tool.uv.sources]
config-manager = { path = "../../packages/config-manager" }
idempotency = { path = "../../packages/idempotency" }
localization = { path = "../../packages/localization" }
security = { path = "../../packages/security" }
observability = { path = "../../packages/observability" }
error-contract = { path = "../../packages/error-contract" }
metrics = { path = "../../packages/metrics" }


[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "../../packages/localization/src", "../../packages/idempotency/src", "../../packages/error-contract/src", "../../packages/metrics/src", "../../packages/security/src", "../../packages/observability/src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.15.13",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
allow_redefinition = true
exclude = "src/core/database/migrations/"
disable_error_code = [
    "attr-defined",
    "arg-type",
    "assignment",
    "dict-item",
    "index",
    "misc",
    "name-defined",
    "no-redef",
    "operator",
    "return",
    "return-value",
    "union-attr",
]
