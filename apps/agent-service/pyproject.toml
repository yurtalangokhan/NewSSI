[project]
name = "agent-service-toolkit"
version = "0.1.0"
description = "Full toolkit for running an AI agent service built with LangGraph, FastAPI and Streamlit"
readme = "README.md"
authors = [{ name = "Joshua Carroll", email = "carroll.joshk@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

requires-python = ">=3.11,<3.14"

dependencies = [
    "config-manager",
    "connector-py[scheduler,postgres,mysql,mongodb,s3,google,sftp,smb,kafka,mssql,spark-thrift]",
    # Spark Connect client of the spark connector. The slim client stands in for
    # connector-py's `spark` extra (pyspark[connect]), which bundles the Spark JARs.
    "pyspark-client>=4.0",
    # pyspark-client declares no protobuf dependency, yet refuses at import time a
    # runtime older than the one its generated code was built with (6.33.5 for 4.2).
    "protobuf>=6.33.5",
    "cryptography>=42.0.0",
    "docx2txt ~=0.8",
    "duckduckgo-search>=7.3.0",
    "error-contract",
    "mermaidx==0.9.5",
    "security",
    "fastapi ~=0.115.5",
    "grpcio >=1.68.0",
    "httpx ~=0.28.0",
    "cachetools>=5.3.0",
    "jiter ~=0.8.2",
    "langchain ~=1.0.5",
    "langchain-core ~=1.0.0",
    "langchain-community ~=0.4.1",
    "langchain-anthropic ~=1.0.0",
    "langchain-aws ~=1.0.0",
    "langchain-chroma ~=1.0.0",
    "langchain-google-genai ~=3.1.0",
    "langchain-google-vertexai>=3.0.3",
    "langchain-groq ~=1.0.1",
    "langchain-ollama ~=1.0.0",
    "langchain-openai ~=1.0.2",
    "langfuse >=2.65.0",
    "langgraph ~=1.0.0",
    "langgraph-checkpoint-postgres ~=2.0.13",
    "langgraph-supervisor ~=0.0.31",
    "langsmith ~=0.4.0",
    "jq ~=1.12.0",
    "json-repair ~=0.63.4",
    "numexpr ~=2.10.1",
    "numpy ~=2.3.4",
    "onnxruntime ~= 1.21.1",
    "pandas ~=2.2.3",
    "psycopg[binary,pool] ~=3.2.4",
    "pyarrow >=18.1.0",
    "tabulate ~=0.10.0",
    "pydantic ~=2.10.1",
    "pydantic-settings ~=2.12.0",
    "openpyxl>=3.1.0",
    "pymupdf ~=1.25.0",
    "pypdf ~=5.3.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "reportlab>=4.2.0",
    "pyowm ~=3.3.0",
    "python-dotenv ~=1.0.1",
    "PyJWT ~=2.10.1",
    "setuptools ~=75.6.0",
    "tiktoken >=0.8.0",
    "uvicorn ~=0.32.1",
    "langchain-mcp-adapters>=0.1.10",
    "ddgs>=9.9.1",
    "langchain-postgres",
    "neo4j>=5.0",
    "croniter ~=5.0",
    "sqlalchemy[asyncio] >=2.0",
    "alembic >=1.13",
    "asyncpg >=0.29",
    "beautifulsoup4 >=4.12.0",
    "chardet >=5.0.0",
    "lxml >=5.0.0",
    "trafilatura >=1.12.0",
    "requests >=2.31.0",
    "minio>=7.0",
    "idempotency",
    "localization",
    "metrics",
    "observability",
]

[tool.uv.sources]
config-manager = { path = "../../packages/config-manager" }
connector-py = { path = "../../packages/connector-py" }
idempotency = { path = "../../packages/idempotency" }
localization = { path = "../../packages/localization" }
security = { path = "../../packages/security" }
error-contract = { path = "../../packages/error-contract" }
metrics = { path = "../../packages/metrics" }
observability = { path = "../../packages/observability" }


[dependency-groups]
dev = [
    "langgraph-cli[inmem]",
    "pytest",
    "pytest-cov",
    "pytest-env",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "fakeredis[lua]>=2.26",
]

# Group for the minimal dependencies to run just the client and Streamlit app.
# These are also installed in the default dependencies.
# To install run: `uv sync --frozen --only-group client`
client = [
    "httpx~=0.28.0",
    "pydantic ~=2.10.1",
    "python-dotenv ~=1.0.1",
]

browser = [
    "playwright >=1.40.0",
]


[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["src", "../../packages/localization/src", "../../packages/idempotency/src", "../../packages/error-contract/src", "../../packages/metrics/src", "../../packages/observability/src", "../../packages/security/src"]
asyncio_default_fixture_loop_scope = "function"

[tool.pytest_env]
OPENAI_API_KEY = "sk-fake-openai-key"

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/migrations/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]

[tool.mypy]
plugins = "pydantic.mypy"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
allow_redefinition = true
disable_error_code = [
    "import-untyped",
    "no-redef",
    "attr-defined",
    "assignment",
    "arg-type",
]

[[tool.mypy.overrides]]
module = [
    "numexpr.*",
    "langchain_mcp_adapters.*",
    "atlas.*",
    "croniter.*",
    "celery.*",
    "minio.*",
    "pymilvus.*",
    "neo4j.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "controller.*",
    "service.*",
    "api.*",
    "core.*",
    "agents.*",
    "agent_composition.*",
    "domain.*",
    "memory.*",
]
disable_error_code = [
    "attr-defined",
    "arg-type",
    "assignment",
    "call-arg",
    "call-overload",
    "dict-item",
    "index",
    "misc",
    "no-redef",
    "operator",
    "override",
    "return",
    "return-value",
    "truthy-function",
    "typeddict-item",
    "typeddict-unknown-key",
    "union-attr",
    "var-annotated",
    "prop-decorator",
]

[[tool.mypy.overrides]]
module = ["numexpr.*"]
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["langchain_mcp_adapters.*"]
ignore_missing_imports = true
