[project]
name = "mcp-server"
version = "0.1.0"
description = "MCP Server for Open Agent Platform"
requires-python = ">=3.11"
dependencies = [
    "config-manager",
    "fastmcp>=2.0.0",
    "error-contract",
    "metrics",
    "httpx>=0.27.0",
    "cachetools>=5.3.0",
    "idempotency",
    "pyjwt>=2.10.0",
    "asyncpg>=0.29.0",
    "asyncssh>=2.20.0",
    "aiomysql>=0.2.0",
    "aioodbc>=0.5.0",
    "aiokafka>=0.12.0",
    "aioboto3>=15.0.0",
    "pymongo>=4.11.0",
    "oracledb>=2.5.0",
    "wcmatch>=10.1",
    "pymupdf>=1.24.0",
    "ddgs>=9.0.0",
    "localization",
    "security",
    "observability",
    "selectolax>=0.3.21",]

[tool.uv.sources]
config-manager = { path = "../../packages/config-manager" }
localization = { path = "../../packages/localization" }
idempotency = { path = "../../packages/idempotency" }
error-contract = { path = "../../packages/error-contract" }
metrics = { path = "../../packages/metrics" }
security = { path = "../../packages/security" }
observability = { path = "../../packages/observability" }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", ".", "../../packages/localization/src", "../../packages/idempotency/src", "../../packages/error-contract/src", "../../packages/metrics/src", "../../packages/observability/src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
allow_redefinition = true
disable_error_code = [
    "attr-defined",
    "no-any-return",
    "no-redef",
    "no-untyped-def",
    "type-arg",
    "untyped-decorator",
]
