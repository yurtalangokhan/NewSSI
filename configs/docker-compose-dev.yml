# =============================================================================
# Docker Compose - Development Services
# 
# Application services only - connects to infrastructure services.
# Service env files are stored in each app folder as .env.
# Run with: docker compose -f configs/docker-compose-dev.yml up -d
# =============================================================================

name: agentic-ai-platform

services:

  # ==========================================================================
  # Agent Service - Core LangGraph orchestration
  # ==========================================================================

  agent-service:
    container_name: agent-service-rf
    build:
      context: ../apps/agent-service
      dockerfile: docker/Dockerfile.service
    restart: unless-stopped
    ports:
      - "8125:8080"
    volumes:
      - /tmp/airbyte_local:/tmp/airbyte_local:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "${KEYCLOAK_PUBLIC_HOSTNAME:-keycloak.localhost}:host-gateway"
    env_file:
      - ../apps/agent-service/.env
    environment:
      # Keep local path stable for docker-mounted Airbyte output
      AIRBYTE_LOCAL_OUTPUT_PATH: /tmp/airbyte_local

      # Service metadata defaults
      LANGCHAIN_PROJECT: agent-service
      KEYCLOAK_ENABLED: "true"
      KEYCLOAK_BASE_URL: http://${KEYCLOAK_PUBLIC_HOSTNAME:-keycloak.localhost}:${KEYCLOAK_PUBLIC_PORT:-8085}
      KEYCLOAK_ISSUER_URL: http://${KEYCLOAK_PUBLIC_HOSTNAME:-keycloak.localhost}:${KEYCLOAK_PUBLIC_PORT:-8085}/realms/agenticai
      KEYCLOAK_REALM: agenticai
      KEYCLOAK_CLIENT_ID: agenticai-web
      KEYCLOAK_AUDIENCE: agent-service

      # All service-to-service traffic through Kong
      USER_SERVICE_URL: http://kong:8000/internal/user-service
      RAG_SERVICE_API_URL: http://kong:8000/internal/rag-service
      RAG_API_URL: http://kong:8000/internal/rag-service
      MCP_SERVER_URL: http://kong:8000/internal/mcp
      TOOLS_SERVICE_URL: http://kong:8000/internal/mcp
    networks:
      airbyte:
        aliases:
          - agent-service

  # ==========================================================================
  # RAG Service - Graph RAG API
  # ==========================================================================

  rag-service:
    container_name: rag-service-rf
    build:
      context: ../apps/rag-service
      dockerfile: Dockerfile
    image: rag-service:local
    restart: unless-stopped
    ports:
      - "8084:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ../apps/rag-service/.env
    environment:
      # Keep permissive CORS in local setup
      ALLOW_ORIGINS: '["*"]'
    networks:
      airbyte:
        aliases:
          - rag-service

  # ==========================================================================
  # Tools Service - MCP Tools Server
  # ==========================================================================

  tools-service:
    container_name: tools-service-rf
    build:
      context: ../apps/tools-service
      dockerfile: Dockerfile
    image: tools-service:local
    restart: unless-stopped
    ports:
      - "8003:8003"
    env_file:
      - ../apps/tools-service/.env
    environment:
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8003"
    volumes:
      - ./workspace:/workspace
    networks:
      airbyte:
        aliases:
          - tools-service

  # ==========================================================================
  # User Service - Auth & User Management
  # ==========================================================================

  user-service:
    container_name: user-service-rf
    build:
      context: ../apps/user-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8090:8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "${KEYCLOAK_PUBLIC_HOSTNAME:-keycloak.localhost}:host-gateway"
    env_file:
      - ../apps/user-service/.env
    environment:
      KEYCLOAK_ENABLED: "true"
      KEYCLOAK_BASE_URL: http://${KEYCLOAK_PUBLIC_HOSTNAME:-keycloak.localhost}:${KEYCLOAK_PUBLIC_PORT:-8085}
      KEYCLOAK_ISSUER_URL: http://${KEYCLOAK_PUBLIC_HOSTNAME:-keycloak.localhost}:${KEYCLOAK_PUBLIC_PORT:-8085}/realms/agenticai
      KEYCLOAK_REALM: agenticai
      KEYCLOAK_CLIENT_ID: agenticai-web
      KEYCLOAK_AUDIENCE: agent-service
    networks:
      airbyte:
        aliases:
          - user-service

  # ==========================================================================
  # Web - Frontend (Onyx)
  # ==========================================================================

  web:
    container_name: web-rf
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    image: web:local
    restart: unless-stopped
    ports:
      - "8126:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "${KEYCLOAK_PUBLIC_HOSTNAME:-keycloak.localhost}:host-gateway"
    environment:
      AUTH_TYPE: oidc
      WEB_DOMAIN: http://localhost:3000
      INTERNAL_URL: http://kong:8000
      USER_SERVICE_URL: http://kong:8000
      AGENT_SERVICE_URL: http://kong:8000
      KEYCLOAK_BASE_URL: http://${KEYCLOAK_PUBLIC_HOSTNAME:-keycloak.localhost}:${KEYCLOAK_PUBLIC_PORT:-8085}
      KEYCLOAK_ISSUER_URL: http://${KEYCLOAK_PUBLIC_HOSTNAME:-keycloak.localhost}:${KEYCLOAK_PUBLIC_PORT:-8085}/realms/agenticai
      KEYCLOAK_CLIENT_ID: agenticai-web
    networks:
      airbyte:
        aliases:
          - web
    depends_on:
      - agent-service
      - user-service
      - rag-service
      - tools-service


networks:
  airbyte:
    external: true
    name: ${AIRBYTE_DOCKER_NETWORK:-agentic-ai-infrastructure_default}
