# =============================================================================
# Docker Compose - Development Services
# 
# Application services only - connects to infrastructure services.
# Service env files are stored in each app folder as .env.
# Run with: docker compose -f configs/docker-compose-dev.yml up -d
# =============================================================================

name: agentic-ai-platform

services:

  # ==========================================================================
  # Agent Service - Core LangGraph orchestration
  # ==========================================================================

  agent-service:
    container_name: agentic-ai-platform-agent-service
    build:
      context: ..
      dockerfile: apps/agent-service/docker/Dockerfile.service
    image: agentic-ai-platform/agent-service:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8123:8123"
    volumes:
      - /tmp/airbyte_local:/tmp/airbyte_local:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "${KEYCLOAK_PUBLIC_HOSTNAME:-keycloak.localhost}:host-gateway"
    env_file:
      - ../apps/agent-service/.env
    environment:
      AIRBYTE_LOCAL_OUTPUT_PATH: /tmp/airbyte_local
      AIRBYTE_CONFIG_DATABASE_URL: ${AIRBYTE_DATABASE_URL}
      AIRBYTE_CONFIG_DATABASE_USER: ${AIRBYTE_DB_USER}
      AIRBYTE_CONFIG_DATABASE_PASSWORD: ${AIRBYTE_DB_PASSWORD}
      AIRBYTE_SECRET_PERSISTENCE: ${AIRBYTE_SECRET_PERSISTENCE}
      LANGCHAIN_PROJECT: agent-service
      TOOLS_SERVICE_URL: http://kong:8000/internal/tools-service/mcp
      MCP_SERVER_URL: http://kong:8000/internal/tools-service/mcp
      RAG_SERVICE_API_URL: http://kong:8000/internal/rag-service
      RAG_API_URL: http://kong:8000/internal/rag-service
      USER_SERVICE_URL: http://kong:8000/internal/user-service
      OLLAMA_BASE_URL: http://ollama:11434
    networks:
      airbyte:
        aliases:
          - agent-service

  # ==========================================================================
  # RAG Service - Graph RAG API
  # ==========================================================================

  rag-service:
    container_name: agentic-ai-platform-rag-service
    build:
      context: ..
      dockerfile: apps/rag-service/Dockerfile
    image: agentic-ai-platform/rag-service:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8083:8083"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ../apps/rag-service/.env
    environment:
      ALLOW_ORIGINS: '["*"]'
      USER_SERVICE_URL: http://kong:8000/internal/user-service
      OLLAMA_BASE_URL: http://ollama:11434
    networks:
      airbyte:
        aliases:
          - rag-service

  # ==========================================================================
  # Tools Service - MCP Tools Server
  # ==========================================================================

  tools-service:
    container_name: agentic-ai-platform-tools-service
    build:
      context: ..
      dockerfile: apps/tools-service/Dockerfile
    image: agentic-ai-platform/tools-service:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8003:8003"
    env_file:
      - ../apps/tools-service/.env
    environment:
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8003"
      AGENT_SERVICE_URL: http://kong:8000/internal/agent-service/api/v1
      USER_SERVICE_URL: http://kong:8000/internal/user-service
      RAG_SERVICE_API_URL: http://kong:8000/internal/rag-service
    volumes:
      - ./workspace:/workspace
    networks:
      airbyte:
        aliases:
          - tools-service

  # ==========================================================================
  # User Service - Auth & User Management
  # ==========================================================================

  user-service:
    container_name: agentic-ai-platform-user-service
    build:
      context: ..
      dockerfile: apps/user-service/Dockerfile
    image: agentic-ai-platform/user-service:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8090:8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "${KEYCLOAK_PUBLIC_HOSTNAME:-keycloak.localhost}:host-gateway"
    env_file:
      - ../apps/user-service/.env
    environment:
      PERMISSION_MANIFEST_ROOT: /app
    volumes:
      - ../apps/agent-service/src/models:/app/apps/agent-service/src/models:ro
      - ../apps/rag-service/langconnect/models:/app/apps/rag-service/langconnect/models:ro
      - ../apps/tools-service/src/models:/app/apps/tools-service/src/models:ro
    networks:
      airbyte:
        aliases:
          - user-service

  # ==========================================================================
  # Web - Frontend (Onyx)
  # ==========================================================================

  web:
    container_name: agentic-ai-platform-web
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: agentic-ai-platform/web:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8126:3000"
    env_file:
      - ../apps/web/.env
    environment:
      INTERNAL_URL: http://kong:8000/agent-service
      AGENT_SERVICE_URL: http://kong:8000/agent-service
      USER_SERVICE_URL: http://kong:8000/user-service
      LANGCONNECT_URL: http://kong:8000/rag-service
      MCP_INTERNAL_URL: http://kong:8000/internal/tools-service/mcp
      MCP_SERVER_URL: http://kong:8000/tools-service/mcp
      TOOLS_SERVICE_URL: http://kong:8000/tools-service/mcp
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "${KEYCLOAK_PUBLIC_HOSTNAME:-keycloak.localhost}:host-gateway"
    networks:
      airbyte:
        aliases:
          - web
    depends_on:
      - agent-service
      - user-service
      - rag-service
      - tools-service


networks:
  airbyte:
    external: true
    name: ${AIRBYTE_DOCKER_NETWORK:-agentic-ai-infrastructure_default}
