# =============================================================================
# Docker Compose — Production Deployment
# Runs EVERYTHING on a single server: Kong, Keycloak, databases, all services.
#
# Usage:
#   docker compose -f configs/docker-compose-production.yml up -d
#
# Secrets: create configs/.env with production values.
# Per-service overrides in apps/*/.env.production are loaded automatically.
# =============================================================================

name: agentic-ai-production

services:

  # ==========================================================================
  # PostgreSQL — Main Database (shared across services)
  # ==========================================================================
  postgres:
    container_name: postgres
    image: postgres:15
    restart: unless-stopped
    ports:
      - "8124:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-agent_service}
      PGDATA: /var/lib/postgresql/data/postgresql.conf
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # ==========================================================================
  # Neo4j — Knowledge Graph
  # ==========================================================================
  neo4j:
    image: neo4j:5.24-community
    container_name: neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-plugins:/plugins
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-neo4j123}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - backend

  # ==========================================================================
  # Milvus — Vector Database (etcd + minio + standalone)
  # ==========================================================================
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.18
    restart: unless-stopped
    command: >
      etcd --advertise-client-urls=http://etcd:2379
      --listen-client-urls=http://0.0.0.0:2379
      --listen-peer-urls=http://0.0.0.0:2380
      --initial-advertise-peer-urls=http://etcd:2380
      --initial-cluster=default=http://etcd:2380
      --data-dir=/etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - milvus-etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health", "--endpoints=http://127.0.0.1:2379"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - backend

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    restart: unless-stopped
    command: minio server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "10000:9000"
      - "10001:9001"
    volumes:
      - milvus-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  milvus:
    container_name: milvus
    image: milvusdb/milvus:v2.5.11
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MILVUS_BIND_ADDR:-0.0.0.0}:9765:19530"
      - "${MILVUS_BIND_ADDR:-0.0.0.0}:9091:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - backend

  # ==========================================================================
  # Keycloak — Identity Provider
  # ==========================================================================
  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.1
    restart: unless-stopped
    command: ["start-dev", "--http-port=8080"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin123}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_HOSTNAME:-10.101.90.13}
      KC_HOSTNAME_PORT: ${KEYCLOAK_PUBLIC_PORT:-8085}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    volumes:
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - backend

  keycloak-bootstrap:
    container_name: keycloak-bootstrap
    image: alpine:3.20
    restart: "no"
    depends_on:
      keycloak:
        condition: service_healthy
    extra_hosts:
      - "keycloak.localhost:host-gateway"
    environment:
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin123}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-agenticai}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-agenticai-web}
      KEYCLOAK_REDIRECT_URI: ${KEYCLOAK_REDIRECT_URI:-*}
      KEYCLOAK_WEB_ORIGIN: ${KEYCLOAK_WEB_ORIGIN:-*}
      KEYCLOAK_POST_LOGOUT_REDIRECT_URIS: ${KEYCLOAK_POST_LOGOUT_REDIRECT_URIS:-+}
      KEYCLOAK_TEST_USER: ${KEYCLOAK_TEST_USER:-devuser}
      KEYCLOAK_TEST_EMAIL: ${KEYCLOAK_TEST_EMAIL:-devuser@local.dev}
      KEYCLOAK_TEST_PASSWORD: ${KEYCLOAK_TEST_PASSWORD:-DevPass123!}
      KEYCLOAK_DEFAULT_ADMIN_USER: ${KEYCLOAK_DEFAULT_ADMIN_USER:-agentic-admin}
      KEYCLOAK_DEFAULT_ADMIN_EMAIL: ${KEYCLOAK_DEFAULT_ADMIN_EMAIL:-admin@agenticai.local}
      KEYCLOAK_DEFAULT_ADMIN_PASSWORD: ${KEYCLOAK_DEFAULT_ADMIN_PASSWORD:-AdminPass123!}
      KEYCLOAK_DEFAULT_ADMIN_FIRST_NAME: ${KEYCLOAK_DEFAULT_ADMIN_FIRST_NAME:-Agentic}
      KEYCLOAK_DEFAULT_ADMIN_LAST_NAME: ${KEYCLOAK_DEFAULT_ADMIN_LAST_NAME:-Admin}
      KEYCLOAK_DEFAULT_ADMIN_REALM_ROLE: ${KEYCLOAK_DEFAULT_ADMIN_REALM_ROLE:-admin}
    volumes:
      - ../scripts/bootstrap_keycloak.sh:/scripts/bootstrap_keycloak.sh:ro
    command:
      - sh
      - -c
      - apk add --no-cache bash curl jq >/dev/null && bash /scripts/bootstrap_keycloak.sh
    networks:
      - backend

  # ==========================================================================
  # Kong — API Gateway (DB-less mode)
  # ==========================================================================
  kong:
    container_name: kong
    image: kong:3.8
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_healthy
    ports:
      - "8000:8000"
      - "8001:8001"
    extra_hosts:
      - "keycloak.localhost:host-gateway"
    volumes:
      - ./kong/kong.yml:/etc/kong/kong.yml:ro
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_LOG_LEVEL: info
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8001/status >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  # ==========================================================================
  # Agent Service — Core LangGraph orchestration
  # ==========================================================================
  agent-service:
    container_name: agent-service
    build:
      context: ../apps/agent-service
      dockerfile: docker/Dockerfile.service
    restart: unless-stopped
    ports:
      - "8125:8080"
    volumes:
      - /tmp/airbyte_local:/tmp/airbyte_local:ro
    env_file:
      - ../apps/agent-service/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      kong:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # ==========================================================================
  # RAG Service — Graph RAG API
  # ==========================================================================
  rag-service:
    container_name: rag-service
    build:
      context: ../apps/rag-service
      dockerfile: Dockerfile
    image: rag-service:production
    restart: unless-stopped
    ports:
      - "8084:8080"
    env_file:
      - ../apps/rag-service/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      kong:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # ==========================================================================
  # Tools Service — MCP Tools Server
  # ==========================================================================
  tools-service:
    container_name: tools-service
    build:
      context: ../apps/tools-service
      dockerfile: Dockerfile
    image: tools-service:production
    restart: unless-stopped
    ports:
      - "8003:8003"
    volumes:
      - ./workspace:/workspace
    env_file:
      - ../apps/tools-service/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      kong:
        condition: service_healthy
    networks:
      - backend

  # ==========================================================================
  # User Service — Auth & User Management
  # ==========================================================================
  user-service:
    container_name: user-service
    build:
      context: ../apps/user-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8090:8090"
    env_file:
      - ../apps/user-service/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      kong:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8090/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # ==========================================================================
  # Web — Frontend (Onyx)
  # ==========================================================================
  web:
    container_name: web
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    image: web:production
    restart: unless-stopped
    ports:
      - "8126:3000"
    env_file:
      - ../apps/web/.env.production
    depends_on:
      - agent-service
      - user-service
      - rag-service
      - tools-service
      - kong
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000 >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - backend

volumes:
  postgres-data:
  neo4j-data:
  neo4j-logs:
  neo4j-plugins:
  milvus-etcd-data:
  milvus-minio-data:
  milvus-data:
  keycloak-data:

networks:
  backend:
    driver: bridge
