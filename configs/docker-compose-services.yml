volumes:
  postgres-data:
    external: true
    name: langgraph-with-ui_postgres-vanilla-data
  neo4j-data:
    external: true
    name: langgraph-with-ui_neo4j-data
  neo4j-logs:
    external: true
    name: langgraph-with-ui_neo4j-logs
