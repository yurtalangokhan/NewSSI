  # ==========================================================================
  # MongoDB - Document store (optional, for LangGraph checkpointing)
  # ==========================================================================

  # ==========================================================================
  # Keycloak - Identity Provider
  # ==========================================================================

  kong:
    container_name: kong
    image: kong:3.8
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
      - "8101:8001"
    extra_hosts:
      # Maps to Docker host for OIDC discovery when KC_HOSTNAME uses a hostname.
      # When KEYCLOAK_PUBLIC_HOSTNAME is an IP, this entry is a no-op — Kong
      # reaches that IP directly via the network.
      - "keycloak.localhost:host-gateway"
      # Keep host.docker.internal available for local-only integrations; the
      # app service upstreams in kong.yml use Docker DNS service names.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./kong/kong.yml:/etc/kong/kong.yml.template:ro
    environment:
      KONG_DATABASE: ${KONG_DATABASE}
      KONG_DECLARATIVE_CONFIG: ${KONG_DECLARATIVE_CONFIG}
      KONG_DNS_ORDER: ${KONG_DNS_ORDER}
      KONG_LOG_LEVEL: ${KONG_LOG_LEVEL}
      KONG_ADMIN_LISTEN: ${KONG_ADMIN_LISTEN}
      KONG_PROXY_LISTEN: ${KONG_PROXY_LISTEN}
      KONG_ADMIN_ACCESS_LOG: ${KONG_ADMIN_ACCESS_LOG}
      KONG_ADMIN_ERROR_LOG: ${KONG_ADMIN_ERROR_LOG}
      KONG_PROXY_ACCESS_LOG: ${KONG_PROXY_ACCESS_LOG}
      KONG_PROXY_ERROR_LOG: ${KONG_PROXY_ERROR_LOG}
      KEYCLOAK_PUBLIC_HOSTNAME: ${KEYCLOAK_PUBLIC_HOSTNAME}
      KEYCLOAK_PUBLIC_PORT: ${KEYCLOAK_PUBLIC_PORT}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_ISSUER_URL: ${KEYCLOAK_ISSUER_URL}
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        if [ -z "$${KEYCLOAK_ISSUER_URL}" ]; then
          echo "KEYCLOAK_ISSUER_URL must be set in configs/.env" >&2
          exit 1
        fi
        issuer="$${KEYCLOAK_ISSUER_URL}"
        sed "s|__KEYCLOAK_ISSUER_URL__|$${issuer}|g" /etc/kong/kong.yml.template > /tmp/kong.yml
        export KONG_DECLARATIVE_CONFIG=/tmp/kong.yml
        exec /docker-entrypoint.sh kong docker-start
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.1
    restart: unless-stopped
    command: ["start-dev", "--http-port=8080"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      KC_DB: ${KEYCLOAK_DB_VENDOR}
      KC_DB_URL_HOST: ${KEYCLOAK_DB_HOST}
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: ${KEYCLOAK_HEALTH_ENABLED}
      KC_HOSTNAME: http://${KEYCLOAK_PUBLIC_HOSTNAME}:${KEYCLOAK_PUBLIC_PORT}
      KC_HOSTNAME_STRICT: ${KEYCLOAK_HOSTNAME_STRICT}
    volumes:
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "read comm < /proc/1/comm; [ \"$$comm\" = \"java\" ]"]
      interval: 10s
      timeout: 5s
      retries: 15

  keycloak-bootstrap:
    container_name: keycloak-bootstrap
    image: alpine:3.20
    restart: "no"
    depends_on:
      keycloak:
        condition: service_healthy
    extra_hosts:
      - "keycloak.localhost:host-gateway"
    environment:
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_REDIRECT_URI: ${KEYCLOAK_REDIRECT_URI}
      KEYCLOAK_WEB_ORIGIN: ${KEYCLOAK_WEB_ORIGIN}
      KEYCLOAK_POST_LOGOUT_REDIRECT_URIS: ${KEYCLOAK_POST_LOGOUT_REDIRECT_URIS}
      KEYCLOAK_TEST_USER: ${KEYCLOAK_TEST_USER}
      KEYCLOAK_TEST_EMAIL: ${KEYCLOAK_TEST_EMAIL}
      KEYCLOAK_TEST_PASSWORD: ${KEYCLOAK_TEST_PASSWORD}
      KEYCLOAK_DEFAULT_ADMIN_USER: ${KEYCLOAK_DEFAULT_ADMIN_USER}
      KEYCLOAK_DEFAULT_ADMIN_EMAIL: ${KEYCLOAK_DEFAULT_ADMIN_EMAIL}
      KEYCLOAK_DEFAULT_ADMIN_PASSWORD: ${KEYCLOAK_DEFAULT_ADMIN_PASSWORD}
      KEYCLOAK_DEFAULT_ADMIN_FIRST_NAME: ${KEYCLOAK_DEFAULT_ADMIN_FIRST_NAME}
      KEYCLOAK_DEFAULT_ADMIN_LAST_NAME: ${KEYCLOAK_DEFAULT_ADMIN_LAST_NAME}
      KEYCLOAK_DEFAULT_ADMIN_REALM_ROLE: ${KEYCLOAK_DEFAULT_ADMIN_REALM_ROLE}
    volumes:
      - ../scripts/bootstrap_keycloak.sh:/scripts/bootstrap_keycloak.sh:ro
    command:
      - sh
      - -c
      - apk add --no-cache bash curl jq >/dev/null && bash /scripts/bootstrap_keycloak.sh

