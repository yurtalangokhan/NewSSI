# =============================================================================
# Docker Compose - Infrastructure Services
# 
# Database, Neo4j, Airbyte, Redis, MongoDB, MySQL
# Run with: docker compose -f docker-compose-services.yml up -d
# =============================================================================

name: agentic-ai-infrastructure

services:

  # ==========================================================================
  # PostgreSQL - Main Database
  # ==========================================================================

  postgres:
    container_name: postgres
    image: postgres:15
    restart: unless-stopped
    ports:
      - "8124:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: ${POSTGRES_PGDATA}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # Neo4j - Knowledge Graph
  # ==========================================================================

  neo4j:
    image: neo4j:5.24-community
    container_name: neo4j
    hostname: neo4j
    restart: unless-stopped
    ports:
      - "8484:7474"   # HTTP (Browser UI)
      - "8697:7687"   # Bolt protocol
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-plugins:/plugins
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME}/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: ${NEO4J_PLUGINS}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL_SIZE}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX_SIZE}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE_SIZE}
      NEO4J_dbms_security_procedures_unrestricted: ${NEO4J_PROCEDURES_UNRESTRICTED}
      NEO4J_dbms_security_procedures_allowlist: ${NEO4J_PROCEDURES_ALLOWLIST}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ==========================================================================
  # Airbyte - Data Connectors (6 containers)
  # ==========================================================================

  airbyte-bootloader:
    container_name: airbyte-bootloader
    image: airbyte/bootloader:${AIRBYTE_VERSION}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRBYTE_VERSION: ${AIRBYTE_VERSION}
      DATABASE_URL: ${AIRBYTE_DATABASE_URL}
      DATABASE_USER: ${AIRBYTE_DB_USER}
      DATABASE_PASSWORD: ${AIRBYTE_DB_PASSWORD}
      RUN_DATABASE_MIGRATION_ON_STARTUP: ${AIRBYTE_RUN_DATABASE_MIGRATION_ON_STARTUP}
      LOG_LEVEL: ${AIRBYTE_LOG_LEVEL}

  airbyte-temporal:
    container_name: airbyte-temporal
    image: airbyte/temporal:${AIRBYTE_VERSION}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      airbyte-bootloader:
        condition: service_completed_successfully
    environment:
      DB: ${AIRBYTE_DB_TYPE}
      DB_PORT: ${AIRBYTE_DB_PORT}
      POSTGRES_USER: ${AIRBYTE_DB_USER}
      POSTGRES_PWD: ${AIRBYTE_DB_PASSWORD}
      POSTGRES_SEEDS: ${AIRBYTE_DB_SEEDS}
      DYNAMIC_CONFIG_FILE_PATH: ${AIRBYTE_DYNAMIC_CONFIG_FILE_PATH}
      LOG_LEVEL: ${AIRBYTE_LOG_LEVEL}
    healthcheck:
      test: ["CMD-SHELL", "nc -z $(hostname -i) 7233 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  airbyte-server:
    container_name: airbyte-server
    image: airbyte/server:${AIRBYTE_VERSION}
    restart: unless-stopped
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      airbyte-bootloader:
        condition: service_completed_successfully
      airbyte-temporal:
        condition: service_healthy
    volumes:
      - airbyte-workspace:/tmp/workspace
      - airbyte-data:/data/config
      - /tmp/airbyte_local:/tmp/airbyte_local
    environment:
      AIRBYTE_VERSION: ${AIRBYTE_VERSION}
      AIRBYTE_ROLE: ${AIRBYTE_ROLE}
      DATABASE_URL: ${AIRBYTE_DATABASE_URL}
      DATABASE_USER: ${AIRBYTE_DB_USER}
      DATABASE_PASSWORD: ${AIRBYTE_DB_PASSWORD}
      TRACKING_STRATEGY: ${AIRBYTE_TRACKING_STRATEGY}
      TEMPORAL_HOST: ${AIRBYTE_TEMPORAL_HOST}
      INTERNAL_API_HOST: ${AIRBYTE_INTERNAL_API_HOST}
      WEBAPP_URL: ${AIRBYTE_WEBAPP_URL}
      WORKER_ENVIRONMENT: ${AIRBYTE_WORKER_ENVIRONMENT}
      WORKSPACE_ROOT: ${AIRBYTE_WORKSPACE_ROOT}
      CONFIG_ROOT: ${AIRBYTE_CONFIG_ROOT}
      LOG_LEVEL: ${AIRBYTE_LOG_LEVEL}
      LOCAL_ROOT: ${AIRBYTE_LOCAL_ROOT}
      DEPLOYMENT_MODE: ${AIRBYTE_DEPLOYMENT_MODE}
      SECRET_PERSISTENCE: ${AIRBYTE_SECRET_PERSISTENCE}
      CONFIGS_DATABASE_MINIMUM_FLYWAY_MIGRATION_VERSION: ${AIRBYTE_CONFIGS_DATABASE_MINIMUM_FLYWAY_MIGRATION_VERSION}
      JOBS_DATABASE_MINIMUM_FLYWAY_MIGRATION_VERSION: ${AIRBYTE_JOBS_DATABASE_MINIMUM_FLYWAY_MIGRATION_VERSION}
      MICRONAUT_ENVIRONMENTS: ${AIRBYTE_MICRONAUT_ENVIRONMENTS}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/api/v1/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  airbyte-worker:
    container_name: airbyte-worker
    image: airbyte/worker:${AIRBYTE_VERSION}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      airbyte-server:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../docker-bin/docker:/usr/bin/docker:ro
      - /tmp/airbyte_local:/tmp/airbyte_local
      - airbyte-workspace:/tmp/workspace
    environment:
      AIRBYTE_VERSION: ${AIRBYTE_VERSION}
      DATABASE_URL: ${AIRBYTE_DATABASE_URL}
      DATABASE_USER: ${AIRBYTE_DB_USER}
      DATABASE_PASSWORD: ${AIRBYTE_DB_PASSWORD}
      INTERNAL_API_HOST: ${AIRBYTE_INTERNAL_API_HOST}
      TEMPORAL_HOST: ${AIRBYTE_TEMPORAL_HOST}
      WORKSPACE_ROOT: ${AIRBYTE_WORKSPACE_ROOT}
      LOCAL_ROOT: ${AIRBYTE_LOCAL_ROOT}
      DOCKER_NETWORK: ${AIRBYTE_DOCKER_NETWORK}
      LOG_LEVEL: ${AIRBYTE_LOG_LEVEL}
      WORKER_ENVIRONMENT: ${AIRBYTE_WORKER_ENVIRONMENT}
      DEPLOYMENT_MODE: ${AIRBYTE_DEPLOYMENT_MODE}
      SECRET_PERSISTENCE: ${AIRBYTE_SECRET_PERSISTENCE}
      MAX_SYNC_WORKERS: ${AIRBYTE_MAX_SYNC_WORKERS}
      MAX_CHECK_WORKERS: ${AIRBYTE_MAX_CHECK_WORKERS}

  airbyte-webapp:
    container_name: airbyte-webapp
    image: airbyte/webapp:${AIRBYTE_VERSION}
    restart: unless-stopped
    ports:
      - "8010:80"
    depends_on:
      airbyte-server:
        condition: service_healthy
    environment:
      INTERNAL_API_HOST: ${AIRBYTE_INTERNAL_API_HOST}
      CONNECTOR_BUILDER_API_HOST: ${AIRBYTE_CONNECTOR_BUILDER_API_HOST}
      AIRBYTE_VERSION: ${AIRBYTE_VERSION}
      TRACKING_STRATEGY: ${AIRBYTE_TRACKING_STRATEGY}

  # ==========================================================================
  # Milvus - Vector Database (etcd + minio + standalone)
  # ==========================================================================

  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.18
    restart: unless-stopped
    command: >
      etcd
      --advertise-client-urls=http://etcd:2379
      --listen-client-urls=http://0.0.0.0:2379
      --listen-peer-urls=http://0.0.0.0:2380
      --initial-advertise-peer-urls=http://etcd:2380
      --initial-cluster=default=http://etcd:2380
      --data-dir=/etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: ${MILVUS_ETCD_AUTO_COMPACTION_MODE}
      ETCD_AUTO_COMPACTION_RETENTION: ${MILVUS_ETCD_AUTO_COMPACTION_RETENTION}
      ETCD_QUOTA_BACKEND_BYTES: ${MILVUS_ETCD_QUOTA_BACKEND_BYTES}
      ETCD_SNAPSHOT_COUNT: ${MILVUS_ETCD_SNAPSHOT_COUNT}
    volumes:
      - milvus-etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health", "--endpoints=http://127.0.0.1:2379"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    restart: unless-stopped
    command: minio server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "10000:9000"
      - "10001:9001"
    volumes:
      - milvus-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  milvus:
    container_name: milvus
    image: milvusdb/milvus:v2.5.11
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ETCD_ENDPOINTS: ${MILVUS_ETCD_ENDPOINTS}
      MINIO_ADDRESS: ${MILVUS_MINIO_ADDRESS}
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MILVUS_BIND_ADDR}:9765:19530"
      - "${MILVUS_BIND_ADDR}:9091:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ==========================================================================
  # Redis - Cache (optional, currently not used)
  # ==========================================================================

  # redis:
  #   container_name: redis
