_format_version: "3.0"
_transform: true

# Kong OSS 3.8 JWT authentication.
#
# Routing strategy:
# 1. Public health/auth endpoints use service-scoped paths.
# 2. Protected endpoints use /{service-name}/api/v1/* and Kong JWT.
# 3. Internal service-to-service traffic must use /internal/{service-name}/*.
# 4. Expired/invalid tokens return 401 from Kong, so web can redirect to login.
# 5. Backend services decode claims for authorization decisions.

services:
  # --------------------------------------------------------------------------
  # User Service
  # --------------------------------------------------------------------------
  - name: user-service-health-public
    url: __USER_SERVICE_UPSTREAM_URL__/api/v1/health
    routes:
      - name: user-service-health-public
        paths:
          - /user-service/health
        methods:
          - GET
        strip_path: true
        preserve_host: true

  - name: user-service-health-canonical-public
    url: __USER_SERVICE_UPSTREAM_URL__/api/v1/health
    routes:
      - name: user-service-health-canonical-public
        paths:
          - /user-service/api/v1/health
        methods:
          - GET
        strip_path: true
        preserve_host: true

  - name: user-service-readiness-public
    url: __USER_SERVICE_UPSTREAM_URL__/api/v1/health/ready
    routes:
      - name: user-service-readiness-public
        paths:
          - /user-service/health/ready
        methods:
          - GET
        strip_path: true
        preserve_host: true

  - name: user-service-readiness-canonical-public
    url: __USER_SERVICE_UPSTREAM_URL__/api/v1/health/ready
    routes:
      - name: user-service-readiness-canonical-public
        paths:
          - /user-service/api/v1/health/ready
        methods:
          - GET
        strip_path: true
        preserve_host: true

  - name: user-service-auth-type-public
    url: __USER_SERVICE_UPSTREAM_URL__/api/v1/auth/type
    routes:
      - name: user-service-auth-type-public
        paths:
          - /user-service/api/v1/auth/type
        methods:
          - GET
        strip_path: true
        preserve_host: true

  - name: user-service-auth-login-public
    url: __USER_SERVICE_UPSTREAM_URL__/api/v1/auth/login
    routes:
      - name: user-service-auth-login-public
        paths:
          - /user-service/api/v1/auth/login
        methods:
          - POST
        strip_path: true
        preserve_host: true

  - name: user-service-auth-external-login-public
    url: __USER_SERVICE_UPSTREAM_URL__/api/v1/auth/external/login
    routes:
      - name: user-service-auth-external-login-public
        paths:
          - /user-service/api/v1/auth/external/login
        methods:
          - POST
        strip_path: true
        preserve_host: true

  - name: user-service-auth-logout-public
    url: __USER_SERVICE_UPSTREAM_URL__/api/v1/auth/logout
    routes:
      - name: user-service-auth-logout-public
        paths:
          - /user-service/api/v1/auth/logout
        methods:
          - POST
        strip_path: true
        preserve_host: true

  - name: user-service-auth-refresh-public
    url: __USER_SERVICE_UPSTREAM_URL__/api/v1/auth/refresh
    routes:
      - name: user-service-auth-refresh-public
        paths:
          - /user-service/api/v1/auth/refresh
        methods:
          - POST
        strip_path: true
        preserve_host: true

  - name: user-service-auth-oidc-authorize-public
    url: __USER_SERVICE_UPSTREAM_URL__/api/v1/auth/oidc/authorize
    routes:
      - name: user-service-auth-oidc-authorize-public
        paths:
          - /user-service/api/v1/auth/oidc/authorize
        methods:
          - GET
        strip_path: true
        preserve_host: true

  - name: user-service-auth-oidc-callback-public
    url: __USER_SERVICE_UPSTREAM_URL__/api/v1/auth/oidc/callback
    routes:
      - name: user-service-auth-oidc-callback-public
        paths:
          - /user-service/api/v1/auth/oidc/callback
        methods:
          - GET
        strip_path: true
        preserve_host: true

  - name: user-service-auth-register-public
    url: __USER_SERVICE_UPSTREAM_URL__/api/v1/auth/register
    routes:
      - name: user-service-auth-register-public
        paths:
          - /user-service/api/v1/auth/register
        methods:
          - POST
        strip_path: true
        preserve_host: true

  - name: user-service
    url: __USER_SERVICE_UPSTREAM_URL__/api/v1
    routes:
      - name: user-service-scoped
        paths:
          - /user-service/api/v1
        strip_path: true
        preserve_host: true
        plugins: &jwt_plugin
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp
              header_names:
                - authorization
              uri_param_names: []
              cookie_names:
                - access_token
                - fastapiusersauth

  # --------------------------------------------------------------------------
  # Agent Service
  # --------------------------------------------------------------------------
  - name: agent-service-health-public
    url: __AGENT_SERVICE_UPSTREAM_URL__/api/v1/health
    routes:
      - name: agent-service-health-public
        paths:
          - /agent-service/health
        methods:
          - GET
        strip_path: true
        preserve_host: true

  - name: agent-service-health-canonical-public
    url: __AGENT_SERVICE_UPSTREAM_URL__/api/v1/health
    routes:
      - name: agent-service-health-canonical-public
        paths:
          - /agent-service/api/v1/health
        methods:
          - GET
        strip_path: true
        preserve_host: true

  - name: agent-service-auth-health-public
    url: __AGENT_SERVICE_UPSTREAM_URL__/api/v1/auth/health
    routes:
      - name: agent-service-auth-health-public
        paths:
          - /agent-service/api/v1/auth/health
        methods:
          - GET
        strip_path: true
        preserve_host: true

  - name: agent-service
    url: __AGENT_SERVICE_UPSTREAM_URL__/api/v1
    # Chat responses stream for as long as the agent works — a deep-research
    # turn that ends in a generated document runs for minutes. Kong's 60s
    # default would cut those off mid-stream (the client sees
    # ERR_INCOMPLETE_CHUNKED_ENCODING). The service also sends SSE keep-alive
    # comments so the connection is never actually idle; this is the backstop.
    read_timeout: 600000
    write_timeout: 600000
    routes:
      - name: agent-service-scoped
        paths:
          - /agent-service/api/v1
        strip_path: true
        preserve_host: true
        plugins: *jwt_plugin

  # --------------------------------------------------------------------------
  # RAG Service
  # --------------------------------------------------------------------------
  - name: rag-service-health-public
    url: __RAG_SERVICE_UPSTREAM_URL__/api/v1/health
    routes:
      - name: rag-service-health-public
        paths:
          - /rag-service/health
        methods:
          - GET
        strip_path: true
        preserve_host: true

  - name: rag-service-health-canonical-public
    url: __RAG_SERVICE_UPSTREAM_URL__/api/v1/health
    routes:
      - name: rag-service-health-canonical-public
        paths:
          - /rag-service/api/v1/health
        methods:
          - GET
        strip_path: true
        preserve_host: true

  - name: rag-service-graph-health-public
    url: __RAG_SERVICE_UPSTREAM_URL__/api/v1/graph/health
    routes:
      - name: rag-service-graph-health-public
        paths:
          - /rag-service/api/v1/graph/health
        methods:
          - GET
        strip_path: true
        preserve_host: true

  - name: rag-service
    url: __RAG_SERVICE_UPSTREAM_URL__/api/v1
    routes:
      - name: rag-service-scoped
        paths:
          - /rag-service/api/v1
        strip_path: true
        preserve_host: true
        plugins: *jwt_plugin

  # --------------------------------------------------------------------------
  # Tools Service (MCP)
  # --------------------------------------------------------------------------
  - name: tools-service-health-public
    url: __TOOLS_SERVICE_UPSTREAM_URL__/health
    routes:
      - name: tools-service-health-public
        paths:
          - /tools-service/health
        methods:
          - GET
        strip_path: true
        preserve_host: true

  - name: tools-service-mcp
    url: __TOOLS_SERVICE_UPSTREAM_URL__/mcp
    routes:
      - name: tools-service-mcp-scoped
        paths:
          - /tools-service/mcp
        strip_path: true
        preserve_host: true
        plugins: *jwt_plugin

  # --------------------------------------------------------------------------
  # Internal routes (no JWT) — for service-to-service communication.
  # Services authenticate via X-Internal-Service-Token at the application
  # layer, so these routes bypass Kong's JWT validation entirely.
  #
  # strip_path=true removes the /internal/{service} prefix so the upstream
  # receives the original internal path (e.g. /api/v1/internal/users/...).
  # --------------------------------------------------------------------------

  - name: internal-agent-connector-tools
    url: __AGENT_SERVICE_UPSTREAM_URL__/api/v1/internal/connector-tools
    routes:
      - name: internal-agent-connector-tools
        paths:
          - /internal/agent-service/api/v1/internal/connector-tools
        methods:
          - POST
        strip_path: true
        preserve_host: true

  - name: internal-user-service
    url: __USER_SERVICE_UPSTREAM_URL__
    routes:
      - name: internal-user-service-all
        paths:
          - /internal/user-service
        strip_path: true
        preserve_host: true

  - name: internal-rag-service
    url: __RAG_SERVICE_UPSTREAM_URL__
    routes:
      - name: internal-rag-service-all
        paths:
          - /internal/rag-service
        strip_path: true
        preserve_host: true

  - name: internal-tools-service
    url: __TOOLS_SERVICE_UPSTREAM_URL__
    routes:
      - name: internal-tools-service-all
        paths:
          - /internal/tools-service
        strip_path: true
        preserve_host: true

consumers:
  - username: keycloak-agenticai
    custom_id: keycloak-agenticai
    jwt_secrets:
      - key: __KEYCLOAK_ISSUER_URL__
        algorithm: RS256
        rsa_public_key: |
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA1jepzAtM2HaScxi1hpeb
          HrTcfsqxbrBJna+5cT5qsNCrUltQmnILy0EIt9Rfo3BWuC30KewDgSO0KbV6HuAN
          1KV3bzx/K4vSSzp86nqpGywdV/zRP2Esn4+3A8ttKMqaZrmCRyu5QpOZGme9pxRh
          MmNJ85/8lBd2+l7ze1NboX2q6mPLTxRiMiFzpYTXevhvlQYzQyJl1BU+9q+fjlL9
          pSm+v2ZXIahOZfMGbdJ+GD4O06zY0fEMHMXN7bk7+c+FiuLr3M+xHKTaJNKaW7mZ
          ZtIWxvQdEMWP2HFaPzOtahwqM+87kEgCCtYZyu12N9fOg5hL/vzAezv0iooldX20
          KwIDAQAB
          -----END PUBLIC KEY-----
        secret: kong-jwt-dummy-secret
