[project]
name = "observability"
version = "0.1.0"
description = "Logging, dependency health, and startup retry for Agentic AI Platform services"
requires-python = ">=3.11"
dependencies = [
    # RetryPolicy.for_dependency resolves the startup retry policy from the
    # shared resilience policy (configs/resilience.yaml). The import itself is
    # lazy - made inside for_dependency - so `import observability` stays cheap
    # for the 150+ modules that only want get_logger.
    "security",
    # Traces and push-based metrics. The SDK is configured only when a service
    # enables telemetry, but the import is unconditional in otel.py's setup path,
    # so it is declared rather than optional.
    "opentelemetry-sdk>=1.38",
    "opentelemetry-exporter-otlp-proto-http>=1.38",]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "pyyaml>=6.0",
]

[tool.uv.sources]
security = { path = "../security" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/observability"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
