[project]
name = "metrics"
version = "0.2.0"
description = "Prometheus-compatible HTTP metrics for Agentic AI Platform services"
requires-python = ">=3.11"
dependencies = [
    "prometheus-client>=0.21",
    "starlette>=0.40",]

[dependency-groups]
dev = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metrics"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
