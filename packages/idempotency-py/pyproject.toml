[project]
name = "idempotency"
version = "0.1.4"
description = "Shared Idempotency-Key middleware for FastAPI services using Redis"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "redis>=5.0",
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idempotency"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
