[project]
name = "security"
version = "0.1.0"
description = "Security mechanisms shared across Agentic AI Platform services"
requires-python = ">=3.11"
dependencies = [
    "cachetools>=5.0",
    "cryptography>=42.0",
    "httpx>=0.27.0",
    "pyjwt>=2.8",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "tenacity>=9.0",]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/security"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
